  /api/v1/health/live:
    get:
      summary: Liveness probe
      description: Answers as long as the process is running. It touches no dependency.
      tags:
        - health
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  uptimeSeconds:
                    type: number
                    minimum: 0
                required:
                  - status
                  - uptimeSeconds
                additionalProperties: false
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      description: Checks the database connection and the applied migration state.
      tags:
        - health
      responses:
        "200":
          description: The instance may serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: ok
                  migrations:
                    type: string
                    const: up-to-date
                required:
                  - status
                  - database
                  - migrations
                additionalProperties: false
        "503":
          description: The instance may not serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: error
                  database:
                    type: string
                    enum:
                      - ok
                      - unavailable
                  migrations:
                    type: string
                    enum:
                      - up-to-date
                      - pending
                      - unknown
                required:
                  - status
                  - database
                  - migrations
                additionalProperties: false
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token issued by `POST /auth/login`. It is also delivered as an HttpOnly cookie.
