                          - CLAIM_ALREADY_CLAIMED
                          - CLAIM_EXPIRED
                          - CLAIM_CLAIM_REVOKED
                          - TICKET_NOT_FOUND
                          - TICKET_REVOKED
                          - TICKET_EXPIRED
                          - EXIT_NOT_ACTIVE
                          - EXIT_ALREADY_COMPLETED
                          - EXIT_PAYMENT_PENDING
                          - EXIT_MANUAL_REVIEW_REQUIRED
                          - EXIT_PLATE_MISMATCH
                          - PAYMENT_NOT_FOUND
                          - PAYMENT_INVALID_AMOUNT
                          - PAYMENT_ALREADY_SETTLED
