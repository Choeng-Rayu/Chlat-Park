  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token and mint a new access token
      description: The presented refresh token is invalidated and a new one is issued. Replaying an old
        token revokes the whole token family.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                additionalProperties: false
