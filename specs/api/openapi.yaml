    post:
      summary: Verify a ticket and read the exit details
      description: "Returns one of exactly nine verdicts: VALID, PAYMENT_PENDING, PLATE_MISMATCH,
        ALREADY_COMPLETED, REVOKED, EXPIRED, UNKNOWN, MANUAL_REVIEW_REQUIRED, NOT_ACTIVE."
      tags:
        - verification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketToken:
                  type: string
                  minLength: 20
                  maxLength: 512
                ticketId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
