  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh token and clear the cookies
      description: "Requires the refresh token, either in the body or in the `chlat_rt` cookie. It is not
        on the public allowlist: an unauthenticated caller has nothing to revoke."
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
      responses:
        "204":
          description: Signed out
  /api/v1/auth/me:
    get:
      summary: Load the actor context and the effective permission list
      description: Returns the signed-in actor, the permissions resolved at request time, and the sites
        the actor may act within.
      tags:
        - auth
      responses:
        "200":
          description: The actor context
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        anyOf:
                          - type: string
                            maxLength: 320
                            format: email
                            pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                          - type: "null"
                      displayName:
                        type:
                          - string
                          - "null"
                      role:
                        type: string
                        enum:
                          - super_admin
                          - owner
                          - guard
                          - user
                      scopeKind:
                        type: string
                        enum:
                          - platform
                          - owned
                          - assigned
                          - self
                    required:
                      - id
                      - email
                      - displayName
                      - role
                      - scopeKind
                    additionalProperties: false
                  permissions:
                    type: array
                    items:
                      type: string
                  siteIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                required:
                  - user
                  - permissions
                  - siteIds
                additionalProperties: false
        "401":
          description: Error
          content:
            application/json:
              schema:
