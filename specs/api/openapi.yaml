  /api/v1/auth/password:
    post:
      summary: Change the signed-in user's password
      description: "A sensitive action: it requires a re-authentication newer than 30 minutes."
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 200
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
              required:
                - currentPassword
                - newPassword
      responses:
        "204":
          description: Password changed
