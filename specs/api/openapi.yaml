  /api/v1/entry-claims/claim:
    post:
      summary: Claim an entry QR and receive an e-ticket
      description: Exchanges the raw claim token for a ticket token. The ticket token is returned exactly
        once. A successful claim moves the session from PENDING_CLAIM to ACTIVE and starts the fee
        clock.
      tags:
        - entry-claims
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claimToken:
                  type: string
                  minLength: 20
                  maxLength: 512
              required:
                - claimToken
      responses:
        "200":
          description: The e-ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: object
