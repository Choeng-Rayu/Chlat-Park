  /api/v1/parking-sessions/{sessionId}/exit/complete:
    post:
      summary: Complete the exit of a session
      description: "The transactional exit completion: re-checks the session status, the payment
        requirement and the ticket under a row lock, then writes the session, ticket, payment, fee
        snapshot and audit row in one transaction. A second concurrent completion loses and receives
        EXIT_ALREADY_COMPLETED."
