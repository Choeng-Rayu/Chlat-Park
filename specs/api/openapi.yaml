openapi: 3.1.0
info:
  title: Chlat-Park API
  version: 1.0.0
  description: |-
    Chlat-Park is an e-ticket parking system: manual, guard-assisted motorcycle parking
    entry and exit, where a paper ticket is replaced by a QR-linked e-ticket bound to a
    motorcycle plate and a parking session.

    Guests never register. They scan the entry QR and receive an e-ticket; the guard scans
    the e-ticket at the exit and authorises the release of the bike.
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.chlat-park.com
    description: Production
tags:
  - name: auth
    description: Sign-in, token rotation and the actor context
  - name: sites
    description: Parking sites and their settings
  - name: pricing
    description: Versioned pricing policies
  - name: parking-sessions
    description: The parking-session lifecycle
  - name: entry-claims
    description: Entry QR issuance and guest claims
  - name: tickets
    description: E-tickets
  - name: verification
    description: Exit verification
  - name: payments
    description: Payments and exemptions
  - name: manual-review
    description: Manual-review cases
  - name: reports
    description: Site and platform reports
  - name: health
    description: Liveness and readiness probes
security:
  - accessToken: []
paths:
  /api/v1/auth/login:
    post:
      summary: Sign in with an email address and a password
      description: Issues an access token and a rotating refresh token. Both are also set as HttpOnly
        cookies. A failed attempt always returns AUTH_INVALID_CREDENTIALS, never a hint about which
        half was wrong.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 320
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 200
              required:
                - email
                - password
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        anyOf:
                          - type: string
                            maxLength: 320
                            format: email
                            pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                          - type: "null"
                      displayName:
                        type:
                          - string
                          - "null"
                      role:
                        type: string
                        enum:
                          - super_admin
                          - owner
                          - guard
                          - user
                      scopeKind:
                        type: string
                        enum:
                          - platform
                          - owned
                          - assigned
                          - self
                    required:
                      - id
                      - email
                      - displayName
                      - role
                      - scopeKind
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
                additionalProperties: false
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VALIDATION_FAILED
                          - NOT_FOUND
                          - CONFLICT
                          - INTERNAL_ERROR
                          - RATE_LIMITED
                          - AUTH_INVALID_CREDENTIALS
                          - AUTH_ACCOUNT_SUSPENDED
                          - AUTH_TOKEN_EXPIRED
                          - AUTH_TOKEN_INVALID
                          - AUTH_REFRESH_REPLAYED
                          - AUTH_REAUTH_REQUIRED
                          - AUTH_CSRF_INVALID
                          - AUTH_UNAUTHENTICATED
                          - AUTHZ_PERMISSION_DENIED
                          - AUTHZ_SCOPE_DENIED
                          - PARK_SESSION_NOT_FOUND
                          - PARK_INVALID_TRANSITION
                          - PARK_DUPLICATE_ACTIVE_SESSION
                          - PARK_PLATE_INVALID
                          - CLAIM_NOT_FOUND
                          - CLAIM_ALREADY_CLAIMED
                          - CLAIM_EXPIRED
                          - CLAIM_CLAIM_REVOKED
                          - TICKET_NOT_FOUND
                          - TICKET_REVOKED
                          - TICKET_EXPIRED
