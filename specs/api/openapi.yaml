  /api/v1/sites:
    get:
      summary: List parking sites
      tags:
        - sites
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
